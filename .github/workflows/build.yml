name: APK bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests der Datenlogik
        run: ./gradlew -PcoreOnly :core:test
      - name: APK bauen
        run: ./gradlew assembleDebug
      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk flussle-${GITHUB_REF_NAME//\//-}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: flussle-apk
          path: flussle-*.apk
      # Bei einem Tag wie v0.3 wird automatisch ein Release mit der APK angelegt
      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" flussle-*.apk --title "$GITHUB_REF_NAME" --generate-notes
