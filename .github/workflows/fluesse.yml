name: Flussdaten aktualisieren

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fluesse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flussläufe aus OpenStreetMap laden
        run: python3 tools/fluesse.py app/src/main/assets/fluesse.json
      - name: Ergebnis einchecken
        run: |
          ls -la app/src/main/assets/fluesse.json
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/fluesse.json
          git diff --cached --quiet || git commit -m "Flussdaten aus OpenStreetMap aktualisiert"
          git push
